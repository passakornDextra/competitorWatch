<!doctype html>
<html lang="en">

  
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Competitor News - Bar System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1d1d1f;
    --ink-light:#424245;
    --ink-lighter:#6e6e73;
    --ink-faint:#a1a1a6;
    --hairline:rgba(0,0,0,.08);
    --border-light:#f1f5f9;
    --bg:#fbfbfd;
    --card:#ffffff;
    --brand:#00a99d;
    --brand-dark:#008a81;
    --brand-light:#e6f7f6;
    --shadow-sm:0 1px 2px rgba(0,0,0,.04);
    --shadow:0 8px 24px -8px rgba(0,0,0,.10);
    --shadow-lg:0 24px 48px -12px rgba(0,0,0,.14);
    --max:1280px;
    --radius:14px;
    --radius-lg:18px;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%; margin:0;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    color:var(--ink); background:var(--bg);
    scroll-behavior:smooth; -webkit-font-smoothing:antialiased;
    font-size:15.5px; letter-spacing:-.01em;
  }
  .wrap{max-width:var(--max); margin:0 auto; padding:0 24px;}

  /* ===================== HEADER ===================== */
  header{
    position:sticky; top:0; z-index:300;
    background:rgba(251,251,253,.78);
    backdrop-filter:saturate(180%) blur(20px);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    border-bottom:1px solid var(--hairline);
    min-height:60px;
    display:flex; align-items:center;
  }
  header .wrap{
    width:100%;
    display:flex; align-items:center; justify-content:space-between;
    gap:16px; padding:10px 24px; flex-wrap:wrap;
  }

  .brand-vertical{display:flex; align-items:center; gap:12px; min-width:0;}
  .logo{
    width:36px; height:36px; border-radius:9px; background:#fff;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    border:1px solid var(--hairline); overflow:hidden;
  }
  .logo img{width:100%; height:100%; object-fit:contain;}
  h1{
    margin:0; font-size:17px; font-weight:700; letter-spacing:-.02em;
    color:var(--ink); white-space:nowrap;
  }

  /* Small secondary brand block (per-product-line logo) next to controls */
  .controls .brand-vertical .logo{
    width:auto; height:32px; padding:0 6px; background:#fff;
  }
  .controls .brand-vertical .logo img{ width:auto; max-width:110px; height:100%; object-fit:contain; }

  /* ===================== CONTROLS (nav triggers + product-line logo) ===================== */
  .controls{
    display:flex; align-items:center; gap:6px;
  }

  .nav-trigger{
    appearance:none; border:0; background:transparent; cursor:pointer;
    font-family:inherit; font-size:13.5px; font-weight:500; color:var(--ink-light);
    padding:8px 14px; border-radius:9px; display:flex; align-items:center; gap:7px;
    transition:color .2s var(--ease), background .2s var(--ease); white-space:nowrap;
  }
  .nav-trigger:hover{color:var(--ink); background:rgba(0,0,0,.04);}
  .nav-trigger.active{color:var(--ink); background:rgba(0,0,0,.055);}
  .nav-trigger .caret{
    width:6px;height:6px; border-right:1.4px solid currentColor; border-bottom:1.4px solid currentColor;
    transform:rotate(45deg) translateY(-1px); transition:transform .25s var(--ease); opacity:.55;
  }
  .nav-trigger.active .caret{transform:rotate(225deg) translateY(1px);}

  .search-trigger{
    display:flex; align-items:center; gap:8px;
    padding:7px 10px 7px 12px; border-radius:9px;
    border:1px solid var(--hairline); background:#fff; color:var(--ink-faint);
    font-size:13px; font-family:inherit; cursor:pointer; transition:.2s var(--ease);
  }
  .search-trigger:hover{border-color:#d2d2d7; color:var(--ink-light);}
  .search-trigger kbd{
    font-family:inherit; font-size:10.5px; padding:1px 5px; border-radius:4px;
    background:var(--bg); border:1px solid var(--hairline); color:var(--ink-faint);
  }

  /* ===================== FILTERS PANEL (hidden trigger, controls live here) ===================== */
  .panel-scrim{
    position:fixed; inset:0; top:60px; z-index:250;
    opacity:0; pointer-events:none; transition:opacity .25s var(--ease);
  }
  .panel-scrim.show{opacity:1; pointer-events:auto;}

  .panel{
    position:absolute; top:100%; background:rgba(251,251,253,.96);
    backdrop-filter:saturate(180%) blur(24px); -webkit-backdrop-filter:saturate(180%) blur(24px);
    border:1px solid var(--hairline); border-radius:16px;
    box-shadow:var(--shadow-lg);
    opacity:0; transform:translateY(-6px) scale(.98); pointer-events:none;
    transition:opacity .28s var(--ease), transform .28s var(--ease);
    z-index:260;
  }
  .panel.show{opacity:1; transform:translateY(0) scale(1); pointer-events:auto;}

  #filtersPanel{ right:24px; margin-top:10px; width:320px; padding:20px; }
  .filter-group{margin-bottom:16px;}
  .filter-group:last-child{margin-bottom:0;}
  .filter-label{
    font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.06em;
    color:var(--ink-faint); margin-bottom:8px; display:block;
  }
  .filter-group select,
  .filter-group input[type="text"]{
    width:100%; font-family:inherit; font-size:14px; color:var(--ink);
    padding:10px 12px; border-radius:10px; border:1px solid var(--hairline);
    background:#fff; appearance:none; cursor:pointer;
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  .filter-group input[type="text"]{cursor:text;}
  .filter-group select:hover, .filter-group input:hover{border-color:#d2d2d7;}
  .filter-group select:focus, .filter-group input:focus{
    outline:none; border-color:var(--brand); box-shadow:0 0 0 3px rgba(0,169,157,.14);
  }
  .filter-reset{
    width:100%; margin-top:4px; padding:10px; border-radius:10px; border:1px solid var(--hairline);
    background:transparent; color:var(--ink-light); font-family:inherit; font-size:13px; font-weight:500;
    cursor:pointer; transition:.2s ease;
  }
  .filter-reset:hover{background:var(--bg); color:var(--ink);}
  .filter-count{
    background:var(--brand); color:#fff; font-size:10.5px; font-weight:700;
    min-width:16px; height:16px; border-radius:8px; display:flex; align-items:center; justify-content:center;
    padding:0 4px;
  }

  /* ===================== COMPETITORS MEGA PANEL ===================== */
  #competitorsPanel{ left:24px; right:24px; margin-top:10px; }
  .panel-inner{
    max-width:1120px; margin:0 auto; padding:36px 32px 28px;
    display:grid; grid-template-columns:repeat(3, 1fr); gap:48px;
  }
  .col-eyebrow{
    font-size:15px; font-weight:700; text-transform:uppercase; letter-spacing:.05em;
    color:var(--ink); margin:0 0 18px;
  }
  .comp-row{display:block; padding:8px 0; text-decoration:none; color:var(--ink);}
  .comp-row-inner{display:flex; align-items:baseline; justify-content:space-between; gap:10px;}
  .comp-name{font-size:16px; font-weight:500; letter-spacing:-.015em; position:relative;}
  .comp-name::after{
    content:""; position:absolute; left:0; bottom:-3px; width:0; height:1px; background:var(--ink);
    transition:width .28s var(--ease);
  }
  .comp-row:hover .comp-name::after{width:100%;}
  .comp-arrow{font-size:12px; color:var(--ink-faint); opacity:0; transform:translateX(-4px); transition:.22s var(--ease);}
  .comp-row:hover .comp-arrow{opacity:1; transform:translateX(0); color:var(--brand-dark);}
  .also{display:block; font-size:11px; color:var(--ink-faint); margin-top:1px;}

  .panel-footer{
    grid-column:1/-1; margin-top:4px; padding-top:20px; border-top:1px solid var(--hairline);
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
  }
  .panel-footer .stat{font-size:12px; color:var(--ink-faint);}
  .panel-footer a{font-size:13px; font-weight:600; color:var(--ink); text-decoration:none; display:flex; align-items:center; gap:6px;}
  .panel-footer a:hover{color:var(--brand-dark);}

  /* ===================== SPOTLIGHT ===================== */
  .spotlight-scrim{
    position:fixed; inset:0; background:rgba(0,0,0,.32); backdrop-filter:blur(2px);
    display:flex; align-items:flex-start; justify-content:center; padding-top:12vh;
    opacity:0; pointer-events:none; transition:opacity .22s var(--ease); z-index:500;
  }
  .spotlight-scrim.show{opacity:1; pointer-events:auto;}
  .spotlight{
    width:min(560px, 90vw); background:rgba(255,255,255,.9);
    backdrop-filter:saturate(180%) blur(30px); -webkit-backdrop-filter:saturate(180%) blur(30px);
    border-radius:16px; box-shadow:0 30px 70px -12px rgba(0,0,0,.35);
    border:1px solid rgba(255,255,255,.6);
    transform:scale(.96) translateY(-8px); transition:transform .24s var(--ease); overflow:hidden;
  }
  .spotlight-scrim.show .spotlight{transform:scale(1) translateY(0);}
  .spotlight-input-row{display:flex; align-items:center; gap:12px; padding:16px 18px; border-bottom:1px solid var(--hairline);}
  .spotlight-input-row svg{flex-shrink:0; opacity:.4;}
  .spotlight-input-row input{
    border:0; outline:0; background:transparent; flex:1; font-family:inherit;
    font-size:18px; font-weight:400; color:var(--ink); letter-spacing:-.01em;
  }
  .spotlight-input-row input::placeholder{color:var(--ink-faint);}
  .spotlight-esc{font-size:11px; color:var(--ink-faint); border:1px solid var(--hairline); padding:2px 6px; border-radius:5px;}
  .spotlight-results{max-height:360px; overflow-y:auto; padding:8px;}
  .sres-section{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); padding:10px 12px 4px;}
  .sres{display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:10px; cursor:pointer; transition:.12s ease;}
  .sres:hover, .sres.sel{background:var(--bg);}
  .sres .dot{width:6px;height:6px;border-radius:50%; flex-shrink:0;}
  .sres .dot.crp{background:#00a99d;}
  .sres .dot.bars{background:#5856d6;}
  .sres .dot.geotec{background:#c8862a;}
  .sres .dot.action{background:var(--ink-faint);}
  .sres .txt{flex:1; min-width:0;}
  .sres .txt .n{font-size:14px; font-weight:500;}
  .sres .txt .l{font-size:11.5px; color:var(--ink-faint);}
  .sres .go{font-size:11px; color:var(--ink-faint); flex-shrink:0;}
  .spotlight-empty{padding:28px 20px; text-align:center; color:var(--ink-faint); font-size:13px;}

  /* ===================== MAIN / ARTICLE COUNT ===================== */
  main.wrap{padding-top:28px; padding-bottom:80px;}

  .article-count{
    display:flex; justify-content:center; align-items:center; margin:0 0 28px;
    font-size:14.5px; font-weight:500; color:var(--ink-light);
    padding:12px 24px; background:var(--card); border-radius:var(--radius);
    box-shadow:var(--shadow-sm); border:1px solid var(--hairline);
  }

  /* ===================== BBC RAIL ===================== */
  .bbc-rail{
    display:grid; grid-template-columns:1fr minmax(0,2fr) 1fr; gap:20px;
    margin-top:4px; align-items:stretch;
  }
  .rail-left, .rail-right{display:grid; grid-auto-rows:1fr; gap:16px;}

  /* ===================== CARDS ===================== */
  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(320px,1fr)); gap:20px; margin-top:28px;}

  .card{
    background:var(--card); border:1px solid var(--hairline); border-radius:var(--radius);
    overflow:hidden; display:flex; flex-direction:column; height:100%;
    box-shadow:var(--shadow-sm);
    transition:transform .3s var(--ease), box-shadow .3s var(--ease), border-color .3s var(--ease);
    animation:fadeIn .4s var(--ease);
  }
  .card:hover{transform:translateY(-4px); box-shadow:var(--shadow-lg); border-color:#e2e2e5;}
  .thumb{
    width:100%; aspect-ratio:16/9; object-fit:contain; background:#fff;
    border-bottom:1px solid var(--hairline);
    transition:transform .4s var(--ease);
  }
  .card:hover .thumb{transform:scale(1.02);}

  .pad{padding:18px 20px 8px; flex:1; display:flex; flex-direction:column;}
  .title{
    font-weight:600; font-size:15.5px; line-height:1.4; margin:0 0 10px; color:var(--ink);
    letter-spacing:-.01em;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .summary{display:none;}
  .meta{
    display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:0 0 12px; font-size:12.5px;
    color:var(--ink-faint); padding-bottom:12px;
  }
  .meta .chip{
    background:var(--bg); color:var(--ink-light); padding:5px 10px; border-radius:7px;
    font-weight:600; font-size:11.5px; letter-spacing:.01em; border:1px solid var(--hairline);
    transition:.2s ease;
  }
  .meta .chip:hover{background:var(--brand); color:#fff; border-color:var(--brand);}
  .meta .chip.line{background:#f2f1ff; color:#5856d6; border-color:transparent;}
  .meta .chip.line:hover{background:#5856d6; color:#fff;}

  .actions{display:flex; gap:10px; padding:0 20px 18px; margin-top:auto;}
  .link{
    flex:1; text-align:center; text-decoration:none; padding:9px 14px; border-radius:9px;
    border:1px solid var(--hairline); background:#fff; font-weight:600; font-size:13px; color:var(--ink-light);
    transition:.2s var(--ease); display:inline-flex; align-items:center; justify-content:center; gap:6px;
  }
  .link:hover{border-color:var(--ink-light); background:var(--ink); color:#fff;}
  .link.primary{background:var(--ink); color:#fff; border-color:var(--ink);}
  .link.primary:hover{background:var(--brand-dark); border-color:var(--brand-dark);}
  .link.secondary{background:transparent;}

  /* lead / side card variants */
  .card--lead .thumb{height:280px; aspect-ratio:auto; object-fit:cover;}
  .card--lead .title{font-size:22px; line-height:1.3; margin-bottom:12px;}
  .card--lead .pad{flex:1;}
  .card--lead .actions{margin-top:auto;}

  .card--side .thumb{height:130px; aspect-ratio:auto; object-fit:cover;}
  .card--side .title{font-size:14.5px;}
  .card--side .meta{padding-bottom:8px;}
  .card--side .meta .chip.line{display:none;}
  .card--side .actions{padding:0 16px 14px;}
  .card--side .pad{padding:14px 16px 4px;}

  .empty, #status{
    background:var(--card); border:1.5px dashed var(--hairline); padding:40px 28px;
    border-radius:var(--radius-lg); text-align:center; color:var(--ink-faint);
    margin-top:28px; font-size:15px; font-weight:500;
  }

  .pager{display:flex; justify-content:center; align-items:center; margin:44px 0 20px; gap:14px;}
  .btn{
    padding:11px 22px; border-radius:10px; border:1px solid var(--hairline); background:var(--card);
    cursor:pointer; font-weight:600; font-size:14px; color:var(--ink-light);
    transition:.2s var(--ease); font-family:inherit;
  }
  .btn:hover:not(:disabled){border-color:var(--ink); background:var(--ink); color:#fff;}
  .btn:disabled{opacity:.35; cursor:not-allowed;}
  #pageInfo{font-weight:600; color:var(--ink-light); min-width:120px; text-align:center; font-size:13.5px;}

  #backToTop{
    position:fixed; bottom:28px; right:28px; background:var(--ink); color:#fff; border:none;
    padding:13px 20px; border-radius:12px; cursor:pointer; display:none;
    box-shadow:var(--shadow-lg); font-weight:600; font-size:14px; font-family:inherit;
    transition:.25s var(--ease); z-index:80;
  }
  #backToTop:hover{background:var(--brand-dark); transform:translateY(-3px);}

  @keyframes fadeIn{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);}}

  @media (max-width: 1100px){
    .bbc-rail{grid-template-columns:1fr;}
    .rail-center{order:1;} .rail-left{order:2;} .rail-right{order:3;}
    .card--lead .thumb{height:220px;}
  }
  @media (max-width: 860px){
    header .wrap{flex-wrap:wrap;}
    .controls{flex-wrap:wrap;}
    .panel-inner{grid-template-columns:1fr; gap:28px; padding:28px 20px;}
    #competitorsPanel{left:12px; right:12px;}
    #filtersPanel{right:12px; width:calc(100vw - 24px);}
  }
  @media (max-width: 640px){
    h1{font-size:15px;}
    .grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="brand-vertical">
      <div class="logo" title="Brand"><img id="brandImg" alt="Brand"></div>
      <h1>Competitor News – Bar System</h1>
    </div>

    <div class="controls">
      <button class="nav-trigger" id="filtersTrigger" type="button" aria-expanded="false" style="display:none">
        <span class="filter-count" id="filterCount" hidden>0</span>
        <span class="caret"></span>
      </button>

      <button class="nav-trigger" id="competitorsTrigger" type="button" aria-expanded="false">
        <span>Select Key Competitors</span>
        <span class="caret"></span>
      </button>

      <button class="search-trigger" id="searchTrigger" type="button">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <span>Search</span>
        <kbd>⌘K</kbd>
      </button>

      <div class="brand-vertical">
        <div class="logo" title="Brand">
          <img id="brandImg1" src="https://raw.githubusercontent.com/passakornDextra/competitorWatch/main/logos/2.%20BAR.png" alt="Brand Logo">
        </div>
      </div>
    </div>
  </div>

  <!-- FILTERS PANEL: real controls scripts.js relies on, trigger hidden above so this never opens -->
  <div class="panel" id="filtersPanel">
    <div class="filter-group">
      <label class="filter-label" for="line">Product Line</label>
      <select id="line">
        <option value="">All Product Lines</option>
        <option value="CRP">CRP</option>
        <option value="Bars">Bars</option>
        <option value="Geotec">Geotec</option>
      </select>
    </div>
    <div class="filter-group">
      <label class="filter-label" for="source">Company</label>
      <select id="source"><option value="">All Companies</option></select>
    </div>
    <div class="filter-group">
      <label class="filter-label" for="search">Keyword</label>
      <input type="text" id="search" placeholder="Search keyword…" />
    </div>
    <div class="filter-group">
      <label class="filter-label" for="sort">Sort</label>
      <select id="sort">
        <option value="date_desc">Newest first</option>
        <option value="date_asc">Oldest first</option>
        <option value="title_asc">Title A–Z</option>
        <option value="title_desc">Title Z–A</option>
      </select>
    </div>
    <button class="filter-reset" id="filterReset" type="button">Clear all filters</button>
  </div>

  <!-- COMPETITORS MEGA PANEL -->
  <div class="panel" id="competitorsPanel">
    <div class="panel-inner" id="panelInner"></div>
  </div>
</header>

<!-- shared scrim for both panels -->
<div class="panel-scrim" id="panelScrim"></div>

<div class="spotlight-scrim" id="spotlightScrim">
  <div class="spotlight">
    <div class="spotlight-input-row">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="spotlightInput" type="text" placeholder="Search articles or jump to a competitor…" autocomplete="off">
      <span class="spotlight-esc">esc</span>
    </div>
    <div class="spotlight-results" id="spotlightResults"></div>
  </div>
</div>

<main class="wrap">
  <div id="status" class="empty">Loading articles…</div>
  <div class="article-count" id="articleCount" hidden></div>
  <section id="rail" class="bbc-rail" hidden>
    <div class="rail-left"></div>
    <div class="rail-center"></div>
    <div class="rail-right"></div>
  </section>
  <section id="grid" class="grid" hidden></section>
  <nav id="pager" class="pager" hidden>
    <button class="btn" id="prev">← Previous</button>
    <span id="pageInfo" class="muted"></span>
    <button class="btn" id="next">Next →</button>
  </nav>
</main>

<button id="backToTop" onclick="window.scrollTo({ top: 0, behavior: 'smooth' });">↑ Top</button>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="scripts.js"></script>

<script>
/* ============================================================
   Header dropdown + search — additive only, does not touch
   scripts.js's STATE, applyFilters, render, or loadCSV.
   Same menu component as the main Competitor News index.
   ============================================================ */

const CW_BASE = "https://dextranet.sharepoint.com/sites/CompetitorsWatch/SitePages/";
const KEY_SUMMARY_URL = "https://dextranet.sharepoint.com/:x:/r/sites/CompetitorsWatch/Shared%20Documents/Key_Competitors_Summary.xlsx?d=w6a74cc0c557b49bc87f73c56406fe3a0&csf=1&web=1&e=DZy633";

// One row per competitor per product line — mirrors the real SharePoint pages.
// Duplicate names (DYWIDAG, SAH Annahütte) are intentional: same company, two pages.
const COMPETITOR_PAGES = [
  { name:"Ancon",             line:"CRP",    page:"c2.aspx" },
  { name:"Boowon BMS",        line:"CRP",    page:"c5.aspx" },
  { name:"Linxion",           line:"CRP",    page:"c6.aspx" },
  { name:"Moment",            line:"CRP",    page:"c1.aspx" },
  { name:"NMB Splice Sleeve", line:"CRP",    page:"c4.aspx" },
  { name:"nVent LENTON",      line:"CRP",    page:"c3.aspx" },
  { name:"Peikko",            line:"CRP",    page:"c7.aspx" },

  { name:"Anker Schröder",    line:"Bars",   page:"b2.aspx" },
  { name:"DYWIDAG",           line:"Bars",   page:"b1.aspx" },
  { name:"Macalloy",          line:"Bars",   page:"b3.aspx" },
  { name:"SAH Annahütte",     line:"Bars",   page:"b5.aspx" },
  { name:"Williams Form",     line:"Bars",   page:"b4.aspx" },

  { name:"DYWIDAG",           line:"Geotec", page:"g5.aspx" },
  { name:"FiReP",             line:"Geotec", page:"g3.aspx" },
  { name:"Mateenbar",         line:"Geotec", page:"g1.aspx" },
  { name:"MST Bar",           line:"Geotec", page:"g2.aspx" },
  { name:"SAH Annahütte",     line:"Geotec", page:"g4.aspx" }
];

const byLineName = {};
COMPETITOR_PAGES.forEach(d => { (byLineName[d.name] ||= []).push(d.line); });

/* ---------- Build the Competitors mega panel ---------- */
function buildCompetitorsPanel(){
  const inner = document.getElementById('panelInner');
  inner.innerHTML = '';
  const lineTitles = { CRP:"CRP", Bars:"Engineered Systems", Geotec:"Ground Engineering Solution" };

  ["CRP","Bars","Geotec"].forEach(line => {
    const col = document.createElement('div');
    const h = document.createElement('div');
    h.className = 'col-eyebrow';
    h.textContent = lineTitles[line];
    col.appendChild(h);

    COMPETITOR_PAGES.filter(d => d.line === line).forEach(item => {
      const a = document.createElement('a');
      a.className = 'comp-row';
      a.href = CW_BASE + item.page;
      a.target = '_blank'; a.rel = 'noopener';
      const others = byLineName[item.name].filter(l => l !== line);
      a.innerHTML = `
        <div class="comp-row-inner">
          <span class="comp-name">${item.name}</span>
          <span class="comp-arrow">→</span>
        </div>
        ${others.length ? `<span class="also">Also in ${others.join(", ")}</span>` : ``}
      `;
      col.appendChild(a);
    });
    inner.appendChild(col);
  });

  const footer = document.createElement('div');
  footer.className = 'panel-footer';
  footer.innerHTML = `
    <span class="stat">${COMPETITOR_PAGES.length} pages · 3 product lines · ${Object.keys(byLineName).length} companies</span>
    <a href="${KEY_SUMMARY_URL}" target="_blank" rel="noopener">Key Competitor Summary (Excel) →</a>
  `;
  inner.appendChild(footer);
}
buildCompetitorsPanel();

/* ---------- Panel open/close plumbing (Filters + Competitors share one scrim) ---------- */
const scrim = document.getElementById('panelScrim');
const filtersTrigger = document.getElementById('filtersTrigger');
const filtersPanel = document.getElementById('filtersPanel');
const competitorsTrigger = document.getElementById('competitorsTrigger');
const competitorsPanel = document.getElementById('competitorsPanel');

function closeAllPanels(){
  [filtersPanel, competitorsPanel].forEach(p => p.classList.remove('show'));
  [filtersTrigger, competitorsTrigger].forEach(t => t.classList.remove('active'));
  scrim.classList.remove('show');
}
function togglePanel(trigger, panel){
  const willOpen = !panel.classList.contains('show');
  closeAllPanels();
  if (willOpen){
    panel.classList.add('show');
    trigger.classList.add('active');
    scrim.classList.add('show');
  }
}
filtersTrigger.addEventListener('click', (e) => { e.stopPropagation(); togglePanel(filtersTrigger, filtersPanel); });
competitorsTrigger.addEventListener('click', (e) => { e.stopPropagation(); togglePanel(competitorsTrigger, competitorsPanel); });
scrim.addEventListener('click', closeAllPanels);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeAllPanels(); });

/* ---------- Filter count badge + reset (cosmetic only, reuses existing IDs) ---------- */
function updateFilterCount(){
  const line = document.getElementById('line').value;
  const source = document.getElementById('source').value;
  const search = document.getElementById('search').value;
  const count = [line, source, search].filter(Boolean).length;
  const badge = document.getElementById('filterCount');
  if (count > 0){ badge.hidden = false; badge.textContent = count; }
  else { badge.hidden = true; }
}
['line','source','search'].forEach(id => {
  document.getElementById(id).addEventListener('input', updateFilterCount);
  document.getElementById(id).addEventListener('change', updateFilterCount);
});
document.getElementById('filterReset').addEventListener('click', () => {
  document.getElementById('line').value = '';
  document.getElementById('line').dispatchEvent(new Event('change'));
  document.getElementById('source').value = '';
  document.getElementById('source').dispatchEvent(new Event('change'));
  document.getElementById('search').value = '';
  document.getElementById('search').dispatchEvent(new Event('input'));
  updateFilterCount();
});

/* ---------- Spotlight (⌘K): article keyword search + competitor quick-jump ---------- */
const spotlightScrim = document.getElementById('spotlightScrim');
const spotlightInput = document.getElementById('spotlightInput');
const spotlightResults = document.getElementById('spotlightResults');
const searchTrigger = document.getElementById('searchTrigger');
let flatResults = [];
let selIndex = 0;

function lineClass(l){ return (l || '').toLowerCase(); }

function renderSpotlight(query){
  const q = (query || '').trim().toLowerCase();
  const compMatches = q ? COMPETITOR_PAGES.filter(d => d.name.toLowerCase().includes(q)) : [];

  flatResults = [];
  let html = '';

  // Action: filter the news feed on this page
  if (q){
    flatResults.push({ type:'action', query:q });
    html += `<div class="sres-section">This page</div>`;
    html += `<div class="sres sel" data-index="0">
               <span class="dot action"></span>
               <span class="txt"><span class="n">Search articles for "${query}"</span><span class="l"> · filters the feed below</span></span>
               <span class="go">↵</span>
             </div>`;
  }

  if (compMatches.length){
    html += `<div class="sres-section">Competitor pages</div>`;
    compMatches.forEach(d => {
      flatResults.push({ type:'competitor', page:d.page });
      const idx = flatResults.length - 1;
      html += `<div class="sres" data-index="${idx}">
                 <span class="dot ${lineClass(d.line)}"></span>
                 <span class="txt"><span class="n">${d.name}</span><span class="l"> · ${d.line}</span></span>
                 <span class="go">↵</span>
               </div>`;
    });
  }

  if (!q){
    html = `<div class="spotlight-empty">Type to search articles, or jump straight to a competitor's page.</div>`;
  } else if (!flatResults.length){
    html = `<div class="spotlight-empty">No matches for "${query}".</div>`;
  }

  spotlightResults.innerHTML = html;
  selIndex = 0;

  spotlightResults.querySelectorAll('.sres').forEach(row => {
    row.addEventListener('click', () => runResult(Number(row.dataset.index)));
  });
}

function runResult(idx){
  const r = flatResults[idx];
  if (!r) return;
  if (r.type === 'action'){
    const searchBox = document.getElementById('search');
    searchBox.value = r.query;
    searchBox.dispatchEvent(new Event('input'));
    updateFilterCount();
    closeSpotlight();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } else if (r.type === 'competitor'){
    window.open(CW_BASE + r.page, '_blank');
    closeSpotlight();
  }
}

function openSpotlight(){
  spotlightScrim.classList.add('show');
  spotlightInput.value = '';
  renderSpotlight('');
  setTimeout(() => spotlightInput.focus(), 50);
}
function closeSpotlight(){ spotlightScrim.classList.remove('show'); }

searchTrigger.addEventListener('click', openSpotlight);
spotlightScrim.addEventListener('click', (e) => { if (e.target === spotlightScrim) closeSpotlight(); });
spotlightInput.addEventListener('input', (e) => renderSpotlight(e.target.value));

document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'){
    e.preventDefault();
    spotlightScrim.classList.contains('show') ? closeSpotlight() : openSpotlight();
  }
  if (e.key === 'Escape') closeSpotlight();

  if (spotlightScrim.classList.contains('show')){
    if (e.key === 'ArrowDown'){ e.preventDefault(); selIndex = Math.min(selIndex+1, flatResults.length-1); updateSpotlightSel(); }
    if (e.key === 'ArrowUp'){ e.preventDefault(); selIndex = Math.max(selIndex-1, 0); updateSpotlightSel(); }
    if (e.key === 'Enter'){ runResult(selIndex); }
  }
});
function updateSpotlightSel(){
  spotlightResults.querySelectorAll('.sres').forEach(r => r.classList.toggle('sel', Number(r.dataset.index) === selIndex));
  const el = spotlightResults.querySelector('.sres.sel');
  if (el) el.scrollIntoView({ block:'nearest' });
}

// initialize badge state once scripts.js has populated #source etc.
updateFilterCount();
</script>
