<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Competitor News - Bar System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1d1d1f;
    --ink-light:#424245;
    --ink-lighter:#6e6e73;
    --ink-faint:#a1a1a6;
    --hairline:rgba(0,0,0,.08);
    --border-light:#f1f5f9;
    --bg:#fbfbfd;
    --card:#ffffff;
    --brand:#00a99d;
    --brand-dark:#008a81;
    --brand-light:#e6f7f6;
    --shadow-sm:0 1px 2px rgba(0,0,0,.04);
    --shadow:0 8px 24px -8px rgba(0,0,0,.10);
    --shadow-lg:0 24px 48px -12px rgba(0,0,0,.14);
    --max:1280px;
    --radius:14px;
    --radius-lg:18px;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%; margin:0;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    color:var(--ink); background:var(--bg);
    scroll-behavior:smooth; -webkit-font-smoothing:antialiased;
    font-size:15.5px; letter-spacing:-.01em;
  }
  .wrap{max-width:var(--max); margin:0 auto; padding:0 24px;}

  /* ===================== HEADER ===================== */
  header{
    position:sticky; top:0; z-index:300;
    background:rgba(251,251,253,.78);
    backdrop-filter:saturate(180%) blur(20px);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    border-bottom:1px solid var(--hairline);
    min-height:60px;
    display:flex; align-items:center;
  }
  header .wrap{
    width:100%;
    display:flex; align-items:center; justify-content:space-between;
    gap:16px; padding:10px 24px; flex-wrap:wrap;
  }

  .brand-vertical{display:flex; align-items:center; gap:12px; min-width:0;}
  .logo{
    width:36px; height:36px; border-radius:9px; background:#fff;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    border:1px solid var(--hairline); overflow:hidden;
  }
  .logo img{width:100%; height:100%; object-fit:contain;}
  h1{
    margin:0; font-size:17px; font-weight:700; letter-spacing:-.02em;
    color:var(--ink); white-space:nowrap;
  }

  /* Small secondary brand block (per-product-line logo) next to controls */
  .controls .brand-vertical .logo{
    width:auto; height:32px; padding:0 6px; background:#fff;
  }
  .controls .brand-vertical .logo img{ width:auto; max-width:110px; height:100%; object-fit:contain; }

  /* ===================== CONTROLS (product-line logo only) ===================== */
  .controls{
    display:flex; align-items:center; gap:8px;
  }

  /* ===================== MAIN / ARTICLE COUNT ===================== */
  main.wrap{padding-top:28px; padding-bottom:80px;}

  main.wrap h2{
    font-size:1.4rem; font-weight:700; color:var(--ink);
    border-left:4px solid var(--brand); padding-left:12px;
    margin:0 0 4px; line-height:1.2;
  }

  .article-count{
    display:flex; justify-content:center; align-items:center; margin:0 0 28px;
    font-size:14.5px; font-weight:500; color:var(--ink-light);
    padding:12px 24px; background:var(--card); border-radius:var(--radius);
    box-shadow:var(--shadow-sm); border:1px solid var(--hairline);
  }

  /* ===================== BBC RAIL ===================== */
  .bbc-rail{
    display:grid; grid-template-columns:1fr minmax(0,2fr) 1fr; gap:20px;
    margin-top:4px; align-items:stretch;
  }
  .rail-left, .rail-right{display:grid; grid-auto-rows:1fr; gap:16px;}

  /* ===================== CARDS ===================== */
  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(320px,1fr)); gap:20px; margin-top:28px;}

  .card{
    background:var(--card); border:1px solid var(--hairline); border-radius:var(--radius);
    overflow:hidden; display:flex; flex-direction:column; height:100%;
    box-shadow:var(--shadow-sm);
    transition:transform .3s var(--ease), box-shadow .3s var(--ease), border-color .3s var(--ease);
    animation:fadeIn .4s var(--ease);
  }
  .card:hover{transform:translateY(-4px); box-shadow:var(--shadow-lg); border-color:#e2e2e5;}
  .thumb{
    width:100%; aspect-ratio:16/9; object-fit:contain; background:#fff;
    border-bottom:1px solid var(--hairline);
    transition:transform .4s var(--ease);
  }
  .card:hover .thumb{transform:scale(1.02);}

  .pad{padding:18px 20px 8px; flex:1; display:flex; flex-direction:column;}
  .title{
    font-weight:600; font-size:15.5px; line-height:1.4; margin:0 0 10px; color:var(--ink);
    letter-spacing:-.01em;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .summary{display:none;}
  .meta{
    display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:0 0 12px; font-size:12.5px;
    color:var(--ink-faint); padding-bottom:12px;
  }
  .meta .chip{
    background:var(--bg); color:var(--ink-light); padding:5px 10px; border-radius:7px;
    font-weight:600; font-size:11.5px; letter-spacing:.01em; border:1px solid var(--hairline);
    transition:.2s ease;
  }
  .meta .chip:hover{background:var(--brand); color:#fff; border-color:var(--brand);}
  .meta .chip.line{background:#f2f1ff; color:#5856d6; border-color:transparent;}
  .meta .chip.line:hover{background:#5856d6; color:#fff;}

  .actions{display:flex; gap:10px; padding:0 20px 18px; margin-top:auto;}
  .link{
    flex:1; text-align:center; text-decoration:none; padding:9px 14px; border-radius:9px;
    border:1px solid var(--hairline); background:#fff; font-weight:600; font-size:13px; color:var(--ink-light);
    transition:.2s var(--ease); display:inline-flex; align-items:center; justify-content:center; gap:6px;
  }
  .link:hover{border-color:var(--ink-light); background:var(--ink); color:#fff;}
  .link.primary{background:var(--ink); color:#fff; border-color:var(--ink);}
  .link.primary:hover{background:var(--brand-dark); border-color:var(--brand-dark);}
  .link.secondary{background:transparent;}

  /* lead / side card variants */
  .card--lead .thumb{height:280px; aspect-ratio:auto; object-fit:cover;}
  .card--lead .title{font-size:22px; line-height:1.3; margin-bottom:12px;}
  .card--lead .pad{flex:1;}
  .card--lead .actions{margin-top:auto;}

  .card--side .thumb{height:130px; aspect-ratio:auto; object-fit:cover;}
  .card--side .title{font-size:14.5px;}
  .card--side .meta{padding-bottom:8px;}
  .card--side .meta .chip.line{display:none;}
  .card--side .actions{padding:0 16px 14px;}
  .card--side .pad{padding:14px 16px 4px;}

  .empty, #status{
    background:var(--card); border:1.5px dashed var(--hairline); padding:40px 28px;
    border-radius:var(--radius-lg); text-align:center; color:var(--ink-faint);
    margin-top:28px; font-size:15px; font-weight:500;
  }

  .pager{display:flex; justify-content:center; align-items:center; margin:44px 0 20px; gap:14px;}
  .btn{
    padding:11px 22px; border-radius:10px; border:1px solid var(--hairline); background:var(--card);
    cursor:pointer; font-weight:600; font-size:14px; color:var(--ink-light);
    transition:.2s var(--ease); font-family:inherit;
  }
  .btn:hover:not(:disabled){border-color:var(--ink); background:var(--ink); color:#fff;}
  .btn:disabled{opacity:.35; cursor:not-allowed;}
  #pageInfo{font-weight:600; color:var(--ink-light); min-width:120px; text-align:center; font-size:13.5px;}

  #backToTop{
    position:fixed; bottom:28px; right:28px; background:var(--ink); color:#fff; border:none;
    padding:13px 20px; border-radius:12px; cursor:pointer; display:none;
    box-shadow:var(--shadow-lg); font-weight:600; font-size:14px; font-family:inherit;
    transition:.25s var(--ease); z-index:80;
  }
  #backToTop:hover{background:var(--brand-dark); transform:translateY(-3px);}

  @keyframes fadeIn{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);}}

  @media (max-width: 1100px){
    .bbc-rail{grid-template-columns:1fr;}
    .rail-center{order:1;} .rail-left{order:2;} .rail-right{order:3;}
    .card--lead .thumb{height:220px;}
  }
  @media (max-width: 860px){
    header .wrap{flex-wrap:wrap;}
    .controls{flex-wrap:wrap;}
  }
  @media (max-width: 640px){
    h1{font-size:15px;}
    .grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="brand-vertical">
      <div class="logo" title="Brand"><img id="brandImg" alt="Brand"></div>
      <h1>Competitor News – Bar System</h1>
    </div>

    <div class="controls">
      <div class="brand-vertical">
        <div class="logo" title="Brand">
          <img id="brandImg1" src="https://raw.githubusercontent.com/passakornDextra/competitorWatch/main/logos/2.%20BAR.png" alt="Brand Logo">
        </div>
      </div>
    </div>

    <!-- Filters kept in the DOM (hidden) so scripts.js can still initialize without errors -->
    <div style="display:none">
      <select id="line">
        <option value="">All Product Lines</option>
        <option value="CRP">CRP</option>
        <option value="Bars">Bars</option>
        <option value="Geotec">Geotec</option>
      </select>
      <select id="source"><option value="">All Companies</option></select>
      <input type="text" id="search" placeholder="Search keyword…" />
      <select id="sort">
        <option value="date_desc">Newest first</option>
        <option value="date_asc">Oldest first</option>
        <option value="title_asc">Title A–Z</option>
        <option value="title_desc">Title Z–A</option>
      </select>
    </div>
  </div>
</header>

<main class="wrap">
  <div id="status" class="empty">Loading articles…</div>
  <div class="article-count" id="articleCount" hidden></div>
  <section id="rail" class="bbc-rail" hidden>
    <div class="rail-left"></div>
    <div class="rail-center"></div>
    <div class="rail-right"></div>
  </section>
  <section id="grid" class="grid" hidden></section>
  <nav id="pager" class="pager" hidden>
    <button class="btn" id="prev">← Previous</button>
    <span id="pageInfo" class="muted"></span>
    <button class="btn" id="next">Next →</button>
  </nav>
</main>

<button id="backToTop" onclick="window.scrollTo({ top: 0, behavior: 'smooth' });">↑ Top</button>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="scripts.js"></script>

</body>
</html>
